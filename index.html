<!DOCTYPE html>
<!--
  ==========================================================================
  OwO Audio Studio v1.0.0（GitHub Pages 版）
  純瀏覽器、免上傳、多格式音訊編輯與轉換工具

  本頁由 GitHub Actions 自動部署到 GitHub Pages，不需要任何伺服器或安裝程式。
  ==========================================================================
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OwO Audio Studio：在瀏覽器內完成毫秒級音訊剪輯、插入空白與多格式轉檔，檔案不會上傳。">
  <meta name="theme-color" content="#0f131c">
  <title>OwO Audio Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="Icons/Icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="Source/App/Styles.css">
</head>
<body>
  <!-- 應用程式根節點：由 Source/App/Main.js 掛載內容 -->
  <div id="App" class="App">
    <div class="Boot">
      <div class="Spinner"></div>
      <p>OwO Audio Studio 載入中…</p>
    </div>
  </div>

  <!-- 啟動錯誤訊息 -->
  <div id="BootError" class="BootError"></div>

  <!-- 直接雙擊本機檔案開啟時的說明 -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('App').innerHTML =
        '<div class="Boot"><h2>請從 GitHub Pages 網址開啟</h2>' +
        '<p>瀏覽器不允許以 file:// 方式載入 ES 模組與 WebAssembly。</p>' +
        '<p>請開啟 https://你的帳號.github.io/儲存庫名稱/ 使用。</p></div>';
    }
  </script>
  <script type="module" src="Source/App/Main.js"></script>
</body>
</html>
